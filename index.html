<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA VI — Таймер обратного отсчета до релиза</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti on release -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg: #090611;
      --card-bg: rgba(20, 14, 34, 0.78);
      --pink: #ff2a8d;
      --pink-glow: rgba(255, 42, 141, 0.45);
      --cyan: #00f2fe;
      --cyan-glow: rgba(0, 242, 254, 0.45);
      --text: #ffffff;
      --text-dim: #9b94b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
      transition: all 0.3s ease;
    }

    /* Ambient background glows */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(150px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.32;
      animation: pulseGlow 10s ease-in-out infinite alternate;
    }
    .glow-pink { top: -100px; left: 10%; background: var(--pink); }
    .glow-cyan { bottom: -100px; right: 10%; background: var(--cyan); animation-delay: -5s; }

    @keyframes pulseGlow {
      0% { opacity: 0.22; transform: scale(0.95); }
      100% { opacity: 0.38; transform: scale(1.1); }
    }

    /* Top Action Bar */
    .top-bar {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }

    .btn-fs {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-fs:hover {
      background: rgba(255, 42, 141, 0.25);
      border-color: var(--pink);
      transform: translateY(-2px);
      box-shadow: 0 0 20px var(--pink-glow);
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      transition: all 0.3s ease;
    }

    /* Logo Header */
    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      width: 240px;
      max-width: 65vw;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 30px rgba(255, 42, 141, 0.5));
      pointer-events: none;
      transition: width 0.3s ease;
    }

    /* Grid for Card */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      width: 100%;
      max-width: 660px;
      transition: max-width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 24px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.55);
      transition: all 0.25s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--pink), transparent);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .days-banner {
      background: rgba(255, 42, 141, 0.15);
      border: 1.5px solid rgba(255, 42, 141, 0.4);
      color: #ff85be;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 16px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 18px rgba(255, 42, 141, 0.2);
    }

    .title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 42, 141, 0.18);
      border: 1px solid rgba(255, 42, 141, 0.4);
      color: #ff9ec7;
    }

    /* Digits Row - 3 Columns (Hours, Minutes, Seconds) */
    .digits {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .col {
      background: rgba(12, 7, 22, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 20px 10px;
      text-align: center;
      transition: all 0.25s ease;
      position: relative;
    }

    .col-hours {
      border-color: rgba(255, 42, 141, 0.45);
      box-shadow: 0 0 25px rgba(255, 42, 141, 0.15);
    }

    .col-secs {
      border-color: rgba(0, 242, 254, 0.45);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
    }

    .col:hover {
      transform: translateY(-3px);
    }

    .num {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(2.8rem, 6vw, 4.2rem);
      font-weight: 700;
      line-height: 1;
      display: block;
      color: #fff;
    }

    .num-hours {
      color: #ffffff;
      text-shadow: 0 0 24px var(--pink-glow);
    }

    .num-secs {
      color: #00f2fe;
      text-shadow: 0 0 24px var(--cyan-glow);
    }

    .lbl {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 8px;
      display: block;
      letter-spacing: 1px;
    }

    .lbl-hours {
      color: #ff59a7;
    }

    .lbl-secs {
      color: #00f2fe;
    }

    .done-msg {
      display: none;
      text-align: center;
      font-weight: 900;
      font-size: 1.25rem;
      padding: 20px 0;
      color: #00ff88;
      text-shadow: 0 0 16px rgba(0, 255, 136, 0.6);
    }

    /* Actions */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .exact-info {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    .btn-cal {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 7px 14px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-cal:hover {
      background: rgba(255, 42, 141, 0.25);
      border-color: var(--pink);
      transform: translateY(-1px);
    }

    .btn-cal svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .footer {
      text-align: center;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.4);
    }

    /* =========================================================================
       FULLSCREEN 2560x1440 EXPERIENCE ("ПО КРАСОТЕ")
       ========================================================================= */
    body.fullscreen-mode {
      padding: 40px;
      justify-content: center;
    }

    body.fullscreen-mode .wrapper {
      max-width: 1400px;
      gap: 36px;
    }

    body.fullscreen-mode .logo-img {
      width: 340px;
      filter: drop-shadow(0 10px 45px rgba(255, 42, 141, 0.65));
    }

    body.fullscreen-mode .grid {
      max-width: 1300px;
    }

    body.fullscreen-mode .card {
      padding: 40px 36px;
      border-radius: 32px;
      gap: 28px;
    }

    body.fullscreen-mode .days-banner {
      font-size: 1.4rem;
      padding: 14px 28px;
      border-radius: 18px;
    }

    body.fullscreen-mode .digits {
      gap: 24px;
    }

    body.fullscreen-mode .col {
      padding: 40px 16px;
      border-radius: 26px;
    }

    body.fullscreen-mode .num {
      font-size: clamp(4.5rem, 9vw, 7.5rem);
    }

    body.fullscreen-mode .lbl {
      font-size: 1.3rem;
      letter-spacing: 2.5px;
      margin-top: 14px;
    }

    body.fullscreen-mode .card-footer {
      padding-top: 20px;
    }

    body.fullscreen-mode .exact-info {
      font-size: 1.15rem;
    }

    body.fullscreen-mode .footer {
      font-size: 1.05rem;
    }

    /* Native 2560x1440 Ultra-wide / 2K media query */
    @media (min-width: 2000px) and (min-height: 1200px) {
      .wrapper {
        max-width: 1450px;
        gap: 36px;
      }
      .logo-img {
        width: 360px;
      }
      .grid {
        max-width: 1350px;
      }
      .card {
        padding: 44px 40px;
        border-radius: 34px;
        gap: 30px;
      }
      .days-banner {
        font-size: 1.45rem;
        padding: 16px 30px;
      }
      .col {
        padding: 46px 20px;
        border-radius: 28px;
      }
      .num {
        font-size: 8rem;
      }
      .lbl {
        font-size: 1.4rem;
        letter-spacing: 3px;
      }
      .exact-info {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <div class="glow glow-pink"></div>
  <div class="glow glow-cyan"></div>

  <!-- Top Right Fullscreen Button -->
  <div class="top-bar">
    <button class="btn-fs" id="btn-fullscreen" onclick="toggleFullscreen()">
      <span id="fs-icon">⛶</span> <span id="fs-text">На весь экран (2560×1440)</span>
    </button>
  </div>

  <div class="wrapper">
    
    <!-- Header with Official Logo -->
    <div class="logo-wrap">
      <img src="logo.png" alt="Grand Theft Auto VI" class="logo-img">
    </div>

    <div class="grid">
      
      <!-- РЕЛИЗ (18.11 в 21:30) -->
      <div class="card card-release">
        <div class="card-top">
          <span class="title">🚀 Релиз GTA VI</span>
          <span class="badge" id="r-badge">18.11 в 21:30</span>
        </div>

        <div class="days-banner" id="r-days-banner">
          ⚡ ОСТАЛОСЬ: 2 ДНЯ ДО РЕЛИЗА
        </div>

        <div class="digits" id="r-timer">
          <div class="col col-hours"><span class="num num-hours" id="r-h">52</span><span class="lbl lbl-hours" id="r-h-lbl">часа</span></div>
          <div class="col"><span class="num" id="r-m">00</span><span class="lbl" id="r-m-lbl">минут</span></div>
          <div class="col col-secs"><span class="num num-secs" id="r-s">00</span><span class="lbl lbl-secs" id="r-s-lbl">секунд</span></div>
        </div>
        <div class="done-msg" id="r-done">ДОЖДАЛИСЬ! ИГРА ВЫШЛА 🎉</div>
        <div class="card-footer">
          <span class="exact-info">18 ноября 2026 • 21:30 (МСК) • Vice City</span>
          <button class="btn-cal" onclick="addToCalendar('release')">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
            В календарь
          </button>
        </div>
      </div>

    </div>

    <footer class="footer">
      Grand Theft Auto VI Countdown • Rockstar Games • PlayStation 5 &amp; Xbox Series X|S
    </footer>

  </div>

  <script>
    const year = new Date().getFullYear();
    function targetDate(d, h, m) {
      let t = new Date(year, 10, d, h, m, 0); // 10 = Ноябрь
      if (new Date() - t > 30 * 86400000) t = new Date(year + 1, 10, d, h, m, 0);
      return t;
    }

    const RELEASE = targetDate(18, 21, 30);
    const pad = n => n < 10 ? '0' + n : n;

    function declOfNum(n, titles) {
      const cases = [2, 0, 1, 1, 1, 2];
      return titles[(n % 100 > 4 && n % 100 < 20) ? 2 : cases[(n % 10 < 5) ? n % 10 : 5]];
    }

    const wDays = ['день', 'дня', 'дней'];
    const wHours = ['час', 'часа', 'часов'];
    const wMins = ['минута', 'минуты', 'минут'];
    const wSecs = ['секунда', 'секунды', 'секунд'];

    let confettiFired = false;

    function tick() {
      const diff = RELEASE - new Date();
      if (diff <= 0) {
        document.getElementById('r-timer').style.display = 'none';
        document.getElementById('r-days-banner').style.display = 'none';
        document.getElementById('r-done').style.display = 'block';
        document.getElementById('r-badge').innerText = 'Игра вышла!';
        if (!confettiFired && typeof confetti === 'function') {
          confettiFired = true;
          confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 } });
        }
        return;
      }

      const totalHours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      // Top days banner
      const banner = document.getElementById('r-days-banner');
      if (days === 0) {
        banner.innerText = '⚡ ФИНАЛЬНЫЙ ДЕНЬ • МЕНЕЕ 24 ЧАСОВ!';
      } else {
        banner.innerText = '⚡ ОСТАЛОСЬ: ' + days + ' ' + declOfNum(days, wDays).toUpperCase() + ' (' + totalHours + ' ' + declOfNum(totalHours, wHours).toUpperCase() + ') ДО РЕЛИЗА';
      }

      // Hourly Countdown
      document.getElementById('r-h').innerText = totalHours;
      document.getElementById('r-m').innerText = pad(m);
      document.getElementById('r-s').innerText = pad(s);

      document.getElementById('r-h-lbl').innerText = declOfNum(totalHours, wHours);
      document.getElementById('r-m-lbl').innerText = declOfNum(m, wMins);
      document.getElementById('r-s-lbl').innerText = declOfNum(s, wSecs);
    }

    tick();
    setInterval(tick, 1000);

    // Fullscreen toggle logic
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(err => {});
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      document.body.classList.toggle('fullscreen-mode', isFs);
      const icon = document.getElementById('fs-icon');
      const text = document.getElementById('fs-text');
      if (isFs) {
        icon.innerText = '🗗';
        text.innerText = 'Выйти из полноэкранного режима';
      } else {
        icon.innerText = '⛶';
        text.innerText = 'На весь экран (2560×1440)';
      }
    });

    // Hotkey F11 toggle support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // .ics Export
    function addToCalendar() {
      const target = RELEASE;
      const title = 'GTA VI — Релиз игры!';
      const desc = 'Официальный релиз Grand Theft Auto VI в 21:30.';
      const end = new Date(target.getTime() + 2 * 3600000);
      const fmt = d => d.toISOString().replace(/-|:|\.\d+/g, '');

      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//GTA6 Countdown//RU',
        'BEGIN:VEVENT',
        `SUMMARY:${title}`,
        `DESCRIPTION:${desc}`,
        `DTSTART:${fmt(target)}`,
        `DTEND:${fmt(end)}`,
        'STATUS:CONFIRMED',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'GTA6_Release.ics';
      a.click();
    }
  </script>
</body>
</html>
